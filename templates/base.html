<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}STELLAR{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        /* ─── RESET & ROOT ─────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --r-md: 16px;
            --r-lg: 24px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        /* ─── REVEAL ───────────────────────────────────────── */
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .reveal.visible {
            opacity: 1 !important;
            transform: none !important;
        }

        /* ─── NAVBAR ────────────────────────────────────────────────── */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 64px;
            background: rgba(8, 12, 20, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border) !important;
            padding: 0 24px;
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--text) !important;
        }

        .nav-link {
            color: var(--text-muted) !important;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text) !important;
        }

        /* cart icon */
        .cart-icon-wrap {
            position: relative;
            padding: 8px;
            color: var(--text);
            font-size: 1.2rem;
            transition: opacity 0.2s;
        }

        .cart-icon-wrap:hover {
            opacity: 0.7;
        }

        .cart-badge {
            position: absolute;
            top: 0;
            right: 0;
            min-width: 18px;
            height: 18px;
            background: var(--primary);
            border-radius: 50%;
            font-size: 0.65rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        /* checkout button */
        .btn-premium {
            padding: 8px 20px;
            border-radius: 8px;
            background: var(--primary);
            border: none !important;
            color: #fff !important;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-premium:hover {
            background: var(--primary-hover);
        }

        /* ─── PRODUCT CARDS ────────────────────────────────── */
        .card-product {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border) !important;
            border-radius: var(--r-md) !important;
            overflow: hidden;
            transition: all 0.3s ease;
            height: 100%;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .card-product:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            border-color: var(--primary) !important;
        }

        .product-image-container {
            height: 260px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .product-image {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .product-description {
            color: var(--text-muted) !important;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* ─── FORMS ─────────────────────────────────────────────────── */
        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 8px !important;
            color: var(--text) !important;
            padding: 12px 16px;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3) !important;
        }

        /* ─── ADD TO CART BUTTON ────────────────────────────────────── */
        .btn-add-cart {
            width: 100%;
            height: 44px;
            border-radius: 8px;
            background: var(--primary);
            border: none;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-add-cart:hover {
            background: var(--primary-hover);
        }

        .btn-add-cart.added {
            background: #10b981;
        }

        /* ─── TOAST ─────────────────────────────────────────────────── */
        #stellar-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        #stellar-toast.show {
            opacity: 1;
        }

        .toast-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            display: inline-block;
            margin-right: 10px;
        }

        /* ─── FOOTER ────────────────────────────────────────────────── */
        footer {
            background: #0f172a;
            border-top: 1px solid var(--glass-border);
            padding: 60px 0 40px;
            margin-top: auto;
        }

        footer .footer-brand {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--text);
        }

        footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .social-btn {
            color: var(--text-muted);
            font-size: 1.25rem;
            margin: 0 10px;
            transition: color 0.2s;
        }

        .social-btn:hover {
            color: var(--text);
        }

        /* ─── GLOBAL ──────────────────────────────────────── */
        * {
            color: var(--text);
        }

        main {
            flex: 1;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0 16px;
            }

            footer {
                padding: 40px 16px 28px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Toast -->
    <div id="stellar-toast">
        <div class="toast-dot"></div>
        <span id="toast-msg">Added to cart</span>
    </div>

    <!-- ── NAVBAR ─────────────────────────────────────────────── -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">STELLAR</a>

            <button class="navbar-toggler border-0" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                style="background:rgba(255,255,255,0.07);border-radius:10px;padding:6px 10px;">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/product' %}active{% endif %}"
                            href="/product">Shop</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <a href="/cart" class="cart-icon-wrap" id="cart-link">
                        <i class="bi bi-bag"></i>
                        <span class="cart-badge" id="cart-count">0</span>
                    </a>
                    <a href="/checkout" class="btn-premium">Checkout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ── MAIN CONTENT ──────────────────────────────────────── -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- ── FOOTER ─────────────────────────────────────────────── -->
    <footer>
        <div class="container text-center">
            <div class="footer-brand">STELLAR</div>
            <p class="mb-4">Discover the finest collection of premium products curated just for you.</p>
            <div class="d-flex justify-content-center gap-2 mb-4">
                <a href="#" class="social-btn"><i class="bi bi-instagram"></i></a>
                <a href="#" class="social-btn"><i class="bi bi-twitter-x"></i></a>
                <a href="#" class="social-btn"><i class="bi bi-facebook"></i></a>
                <a href="#" class="social-btn"><i class="bi bi-pinterest"></i></a>
            </div>
            <p class="copy mb-0">© 2026 Stellar Shop. Built with Elegance.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        /* ── CART ─────────────────────────────────────────────────── */
        function updateCartUI() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const count = cart.reduce((acc, item) => acc + item.quantity, 0);
            document.getElementById('cart-count').textContent = count;
        }

        function addToCart(id, title, price, image, btn) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existing = cart.find(item => String(item.id) == String(id));
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id: String(id), title, price: parseFloat(price), image, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();

            if (btn) {
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="bi bi-check-lg"></i> Added';
                btn.classList.add('added');
                setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('added'); }, 2000);
            }

            showToast('Added — ' + title);
        }

        /* ── TOAST ────────────────────────────────────────────────── */
        function showToast(msg) {
            const t = document.getElementById('stellar-toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2800);
        }

        /* ── EVENT DELEGATION (add-to-cart) ───────────────────────── */
        document.body.addEventListener('click', e => {
            const btn = e.target.closest('.add-to-cart-btn');
            if (btn) {
                const d = btn.dataset;
                addToCart(d.id, d.title, d.price, d.image, btn);
            }
        });

        /* ── INIT ─────────────────────────────────────────────────── */
        function initReveal() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateCartUI();
            initReveal();
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>

</html>
