{% extends "base.html" %}

{% block title %}Shop Collection | STELLAR{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row align-items-end mb-5">
            <div class="col-md-6">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/" class="text-muted text-decoration-none">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Shop</li>
                    </ol>
                </nav>
                <h1 class="fw-bold">Our Collection</h1>
            </div>
            <div class="col-md-6 text-md-end">
                <span class="text-muted">{{ products|length }} products found</span>
            </div>
        </div>

        <div class="row g-4">
            {% for p in products %}
            <div class="col-md-6 col-lg-3 reveal reveal-fade-up stagger-{{ loop.index % 4 + 1 }}">
                <div class="card-product p-3">
                    <div class="product-image-container rounded-4 mb-3">
                        <img src="{{ p.image }}" alt="{{ p.title }}" class="product-image">
                    </div>
                    <span class="category-badge">{{ p.category }}</span>
                    <h5 class="mb-2" style="font-size: 1rem; height: 3rem; overflow: hidden;">{{ p.title }}</h5>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="product-price">${{ p.price }}</span>
                        <div class="d-flex gap-2">
                            <a href="/product/{{ p.id }}" class="btn btn-sm btn-outline-light rounded-circle"><i class="bi bi-eye"></i></a>
                            <button class="btn btn-sm btn-premium rounded-circle add-to-cart-btn"
                                    data-id="{{ p.id }}"
                                    data-title="{{ p.title }}"
                                    data-price="{{ p.price }}"
                                    data-image="{{ p.image }}">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
