{% extends "base.html" %}

{% block title %}Your Cart | STELLAR{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <h1 class="fw-bold mb-5">Shopping Cart</h1>

        <div class="row g-5">
            <div class="col-lg-8">
                <div id="cart-items-container">
                    <!-- Items will be injected here by JS -->
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card-product p-4 position-sticky" style="top: 100px;">
                    <h4 class="fw-bold mb-4">Order Summary</h4>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-white">Subtotal</span>
                        <span id="summary-subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-white">Shipping</span>
                        <span class="text-success">FREE</span>
                    </div>
                    <hr class="my-4" style="border-color: rgba(255,255,255,0.1);">
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fw-bold fs-5">Total</span>
                        <span class="fw-bold fs-5" id="summary-total">$0.00</span>
                    </div>
                    <a href="/checkout" class="btn btn-premium w-100 py-3 mb-3">Proceed to Checkout</a>
                    <a href="/product" class="btn btn-outline-light w-100 py-3">Continue Shopping</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    function renderCart() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const container = document.getElementById('cart-items-container');
        
        if (cart.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-cart-x fs-1 text-white mb-3 d-block"></i>
                    <h3 class="fw-bold">Your cart is empty</h3>
                    <p class="text-white">Looks like you haven't added anything yet.</p>
                    <a href="/product" class="btn btn-premium mt-3">Start Shopping</a>
                </div>
            `;
            updateSummary(0);
            return;
        }

        let html = '';
        let total = 0;
        
        cart.forEach((item, index) => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            html += `
                <div class="card-product p-4 mb-3">
                    <div class="row align-items-center">
                        <div class="col-md-2 col-4">
                            <div class="bg-white p-2 rounded-3 text-center">
                                <img src="${item.image}" alt="${item.title}" class="img-fluid" style="max-height: 80px;">
                            </div>
                        </div>
                        <div class="col-md-5 col-8">
                            <h5 class="mb-1 text-truncate">${item.title}</h5>
                            <span class="text-white">$${item.price} each</span>
                        </div>
                        <div class="col-md-3 col-6 mt-md-0 mt-3">
                            <div class="input-group input-group-sm" style="max-width: 120px;">
                                <button class="btn btn-outline-light" onclick="changeQty(${item.id}, -1)">-</button>
                                <input type="text" class="form-control bg-transparent text-white text-center border-light" value="${item.quantity}" readonly>
                                <button class="btn btn-outline-light" onclick="changeQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                        <div class="col-md-2 col-6 mt-md-0 mt-3 text-end">
                            <div class="fw-bold mb-1">$${itemTotal.toFixed(2)}</div>
                            <button class="btn btn-link text-danger p-0" onclick="removeItem(${item.id})"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
        updateSummary(total);
    }

    function changeQty(id, delta) {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const item = cart.find(i => i.id === id);
        if (item) {
            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
            updateCartUI();
        }
    }

    function removeItem(id) {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        cart = cart.filter(i => i.id !== id);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
        updateCartUI();
    }

    function updateSummary(total) {
        document.getElementById('summary-subtotal').textContent = '$' + total.toFixed(2);
        document.getElementById('summary-total').textContent = '$' + total.toFixed(2);
    }

    document.addEventListener('DOMContentLoaded', renderCart);
</script>
{% endblock %}
